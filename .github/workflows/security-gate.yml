name: Security Gate

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tms/requirements.txt
      - name: Run Python test suites
        run: |
          python -m unittest tests.test_app tests.test_email_engine
        working-directory: tms
      - name: Run core repo test suites
        run: |
          python -m unittest \
            tms.tests.test_full_app \
            tms.tests.test_api_requests \
            tms.tests.test_tracking \
            tms.tests.test_notifications \
            tms.tests.test_launch_guardrails

  js-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install Node tooling
        run: npm ci
      - name: ESLint
        run: npm run lint:js
      - name: Vitest
        run: npm run test:js
      - name: Next Build Guard
        run: npm run build:next

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep
      - name: Run Semgrep
        env:
          PYTHONUTF8: "1"
        run: |
          pysemgrep --config=auto --error \
            --exclude=node_modules \
            --exclude=static \
            --exclude=templates \
            --exclude=tests \
            --exclude=tms/tests \
            --exclude-rule=python.django.security.django-no-csrf-token.django-no-csrf-token \
            --exclude-rule=javascript.browser.security.insecure-document-method.insecure-document-method \
            --exclude-rule=python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query \
            --exclude-rule=python.lang.security.audit.formatted-sql-query.formatted-sql-query \
            --exclude-rule=python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected \
            .

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  snyk:
    if: ${{ secrets.SNYK_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Snyk
        run: npm install -g snyk
      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}
      - name: Run Snyk
        run: snyk test --all-projects --severity-threshold=high --skip-unresolved
