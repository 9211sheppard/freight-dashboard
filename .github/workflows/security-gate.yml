name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tms/requirements.txt
      - name: Run sandbox auth tests
        run: |
          python -m unittest tests.test_app tests.test_email_engine
        working-directory: tms
      - name: Run secure core suites
        run: |
          python -m unittest \
            tms.tests.test_full_app \
            tms.tests.test_api_requests \
            tms.tests.test_tracking \
            tms.tests.test_notifications \
            tms.tests.test_launch_guardrails \
            tms.tests.test_tenant_admin \
            tms.tests.test_secret_storage

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tms/requirements.txt
      - name: Install Node tooling
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        run: npm run test:e2e
      - name: Playwright accessibility
        run: npm run test:a11y
      - name: Lighthouse
        run: npm run test:lighthouse

  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: grafana/setup-k6-action@v1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tms/requirements.txt
      - name: Install Node tooling
        run: npm ci
      - name: k6 smoke
        run: npm run test:k6

  js-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install Node tooling
        run: npm ci
      - name: ESLint
        run: npm run lint:js
      - name: Vitest
        run: npm run test:js
      - name: Next Build Guard
        run: npm run build:next
      - name: npm audit
        run: npm audit --audit-level=high

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep
      - name: Run Semgrep
        env:
          PYTHONUTF8: "1"
        run: |
          pysemgrep --config=auto --error \
            --include=*.py \
            --exclude=node_modules \
            --exclude=static \
            --exclude=templates \
            --exclude=tests \
            --exclude=tms/tests \
            --exclude-rule=python.django.security.django-no-csrf-token.django-no-csrf-token \
            --exclude-rule=python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query \
            --exclude-rule=python.lang.security.audit.formatted-sql-query.formatted-sql-query \
            --exclude-rule=python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected \
            --exclude-rule=python.flask.security.audit.app-run-param-config.avoid_app_run_with_bad_host \
            .

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: Trivy filesystem scan
        run: trivy fs --severity HIGH,CRITICAL --ignore-unfixed .

  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Skip when Snyk token is missing
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "SNYK_TOKEN is not configured; skipping Snyk."
      - name: Install Snyk
        if: ${{ env.SNYK_TOKEN != '' }}
        run: npm install -g snyk
      - name: Authenticate Snyk
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk auth $SNYK_TOKEN
      - name: Run Snyk
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk test --all-projects --severity-threshold=high --skip-unresolved

  stripe-e2e:
    runs-on: ubuntu-latest
    env:
      ENABLE_STRIPE: "true"
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      BASE_URL: https://example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tms/requirements.txt
      - name: Skip when Stripe secrets are missing
        if: ${{ env.STRIPE_SECRET_KEY == '' || env.STRIPE_WEBHOOK_SECRET == '' }}
        run: echo "Stripe test-mode secrets are not configured; skipping Stripe E2E."
      - name: Run Stripe E2E
        if: ${{ env.STRIPE_SECRET_KEY != '' && env.STRIPE_WEBHOOK_SECRET != '' }}
        run: python -m unittest tms.tests.test_stripe_e2e
