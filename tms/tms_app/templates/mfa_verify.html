{% extends "base.html" %}
{% block title %}Verify MFA | TMS Sandbox{% endblock %}
{% block content %}
<section class="panel narrow">
  <div class="panel-head">
    <p class="eyebrow">Step 2</p>
    <h3>Enter your authenticator code</h3>
  </div>
  <p class="hint">Account: {{ user["email"] }}</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>
      <span>6-digit TOTP code</span>
      <input type="text" name="code" inputmode="numeric" pattern="[0-9 ]{6,8}" maxlength="8" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
