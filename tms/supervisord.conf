[supervisord]
nodaemon=true
loglevel=info

[program:gunicorn]
directory=/app
command=/bin/sh -c "exec gunicorn --workers ${GUNICORN_WORKERS:-2} --bind ${GUNICORN_BIND:-127.0.0.1:8000} --timeout 120 wsgi:app"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

