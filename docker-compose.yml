version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: freightdash
      POSTGRES_USER: freightdash
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://freightdash:localdev@db:5432/freightdash
      SECRET_KEY: local-dev-secret-change-in-production
      PORT: "5000"
      PRODUCTION: "1"
    depends_on:
      - db

volumes:
  pgdata:
