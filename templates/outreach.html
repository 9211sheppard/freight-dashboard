{% extends "base.html" %}
{% block title %}Outreach — Flash Cargo{% endblock %}

{% block content %}
<div class="container-fluid px-3 py-3">

  <!-- Stats bar -->
  <div class="row g-3 mb-3" id="statsRow">
    <div class="col-6 col-md-3">
      <div class="card shadow-sm text-center py-3">
        <div class="fs-4 fs-md-2 fw-bold" id="st-sent">—</div>
        <div class="small text-muted">Sent</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card shadow-sm text-center py-3">
        <div class="fs-4 fs-md-2 fw-bold text-success" id="st-replied">—</div>
        <div class="small text-muted">Replied</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card shadow-sm text-center py-3">
        <div class="fs-4 fs-md-2 fw-bold text-warning" id="st-pending">—</div>
        <div class="small text-muted">Pending</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card shadow-sm text-center py-3">
        <div class="fs-4 fs-md-2 fw-bold text-danger" id="st-bounced">—</div>
        <div class="small text-muted">Bounced</div>
      </div>
    </div>
  </div>

  <!-- Filter + Poll -->
  <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
    <div class="btn-group btn-group-sm overflow-auto" role="group">
      <button class="btn btn-outline-secondary active" data-filter="all" onclick="setFilter('all',this)">All</button>
      <button class="btn btn-outline-success" data-filter="replied" onclick="setFilter('replied',this)">Replied</button>
      <button class="btn btn-outline-warning" data-filter="pending" onclick="setFilter('pending',this)">Pending</button>
      <button class="btn btn-outline-danger" data-filter="bounced" onclick="setFilter('bounced',this)">Bounced</button>
    </div>
    <input class="form-control form-control-sm" id="searchBox"
           placeholder="Search company, email, country…" style="max-width:260px; min-width:120px; flex:1 1 auto;" oninput="renderTable()">
    <button class="btn btn-sm btn-outline-info ms-auto flex-shrink-0" id="pollBtn" onclick="pollInbox()">
      <i class="bi bi-arrow-repeat me-1"></i>Poll Inbox
    </button>
  </div>

  <!-- Table -->
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0 small" id="outreachTable">
        <thead>
          <tr>
            <th class="text-nowrap">Company</th>
            <th class="text-nowrap">Country</th>
            <th class="text-nowrap">Email</th>
            <th class="text-nowrap">Sent</th>
            <th class="text-nowrap">Status</th>
            <th class="text-nowrap">Lanes Confirmed</th>
            <th class="text-nowrap">Carriers Confirmed</th>
          </tr>
        </thead>
        <tbody id="outreachBody">
          <tr><td colspan="7" class="text-center text-secondary py-4">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
let _all = [], _filter = 'all';

function statusBadge(row) {
  if (row.reply_received) return '<span class="badge bg-success">Replied</span>';
  if (row.status === 'bounced') return '<span class="badge bg-danger">Bounced</span>';
  if (row.status === 'failed') return '<span class="badge bg-danger">Failed</span>';
  return '<span class="badge bg-warning text-dark">Pending</span>';
}

function fmtLanes(row) {
  const lanes = row.lanes_confirmed || row.lane_clicks || '';
  if (!lanes) return '<span class="text-secondary">—</span>';
  let arr;
  try { arr = JSON.parse(lanes); } catch(e) { arr = lanes.split(','); }
  if (!Array.isArray(arr) || !arr.length) return '<span class="text-secondary">—</span>';
  return arr.map(l => `<span class="badge bg-primary me-1 mb-1">${l.trim()}</span>`).join('');
}

function fmtCarriers(row) {
  const c = row.carriers_confirmed || row.carrier_clicks || '';
  if (!c) return '<span class="text-secondary">—</span>';
  let arr;
  try { arr = JSON.parse(c); } catch(e) { arr = c.split(','); }
  if (!Array.isArray(arr) || !arr.length) return '<span class="text-secondary">—</span>';
  return arr.map(x => `<span class="badge bg-secondary me-1 mb-1">${x.trim()}</span>`).join('');
}

function fmtDate(s) {
  if (!s) return '—';
  return s.substring(0, 10);
}

function setFilter(f, btn) {
  _filter = f;
  document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function renderTable() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const rows = _all.filter(r => {
    const matchFilter =
      _filter === 'all' ||
      (_filter === 'replied' && r.reply_received) ||
      (_filter === 'pending' && !r.reply_received && r.status !== 'bounced' && r.status !== 'failed') ||
      (_filter === 'bounced' && (r.status === 'bounced' || r.status === 'failed'));
    const matchQ = !q ||
      (r.company_name||'').toLowerCase().includes(q) ||
      (r.email||'').toLowerCase().includes(q) ||
      (r.country||'').toLowerCase().includes(q) ||
      (r.contact_name||'').toLowerCase().includes(q);
    return matchFilter && matchQ;
  });

  const tbody = document.getElementById('outreachBody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-secondary py-4">No records found</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>
        <div class="fw-semibold">${r.company_name || '—'}</div>
        <div class="text-secondary" style="font-size:11px">${r.contact_name || ''}</div>
      </td>
      <td>${r.country || '—'}</td>
      <td class="text-secondary">${r.email || '—'}</td>
      <td class="text-secondary">${fmtDate(r.sent_at)}</td>
      <td>${statusBadge(r)}</td>
      <td style="max-width:280px">${fmtLanes(r)}</td>
      <td style="max-width:240px">${fmtCarriers(r)}</td>
    </tr>`).join('');
}

function loadStats() {
  fetch('/api/intro/stats').then(r => r.json()).then(s => {
    document.getElementById('st-sent').textContent    = s.total_sent;
    document.getElementById('st-replied').textContent = s.replied;
    document.getElementById('st-pending').textContent = s.pending;
    document.getElementById('st-bounced').textContent = s.bounced;
  });
}

function pollInbox() {
  const btn = document.getElementById('pollBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Polling…';
  fetch('/api/inbox/poll', {method:'POST'}).then(r => r.json()).then(d => {
    btn.disabled = false;
    btn.innerHTML = '<i class="bi bi-arrow-repeat me-1"></i>Poll Inbox';
    load();
  });
}

function load() {
  fetch('/api/outreach/replies').then(r => r.json()).then(data => {
    _all = data;
    renderTable();
    loadStats();
  });
}

load();
</script>
{% endblock %}
