<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %}</title>
  <!-- Bootstrap 5 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ sv|default('1') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='learn.css') }}?v={{ sv|default('1') }}">
</head>
<body>

{% block navbar %}
<nav class="navbar navbar-dark navbar-expand-lg px-3 py-2" id="main-nav">
  <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold flex-shrink-0" href="#">
    <i class="bi bi-people-fill fs-5"></i>
  </a>
  <div class="quote-ticker-wrap d-none d-lg-flex">
    <div id="quoteTicker"></div>
  </div>
  <div class="ms-auto d-flex align-items-center gap-2 flex-shrink-0">
    <span class="text-secondary small" id="nav-db-count"></span>
    <span class="text-secondary small d-none d-md-inline" id="nav-last-sync" title="Last time CSV was synced"></span>
    <!-- Hidden file input -->
    <input type="file" id="csvFileInput" accept=".csv" style="display:none">
    <button class="btn btn-sm btn-outline-info" id="learnBtn" title="Start a learning session">
      <i class="bi bi-book me-1"></i><span class="d-none d-md-inline">Learn</span>
    </button>
    <button class="btn btn-sm btn-outline-warning" id="importCsvBtn" title="Import a CSV file you received by email">
      <i class="bi bi-upload" id="importIcon"></i> Import CSV
    </button>
    <button class="btn btn-sm btn-outline-light" id="refreshBtn" title="Re-import CSV now">
      <i class="bi bi-arrow-clockwise" id="refreshIcon"></i> Refresh Data
    </button>
    <a href="{{ url_for('logout') }}" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-box-arrow-right"></i> Logout
    </a>
  </div>

  <!-- Toast notification -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:11000">
    <div id="syncToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive">
      <div class="d-flex">
        <div class="toast-body" id="syncToastMsg">Data refreshed.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>
</nav>
{% endblock %}

{% if session.get('logged_in') %}
<div class="tab-nav-strip">
  <a href="/dashboard" class="tab-link {% if active_tab == 'contacts' %}active{% endif %}">
    <i class="bi bi-people-fill"></i> Contacts
  </a>
  <a href="/lanes" class="tab-link {% if active_tab == 'lanes' %}active{% endif %}">
    <i class="bi bi-ship"></i> Lanes
  </a>
  <a href="/carriers" class="tab-link {% if active_tab == 'carriers' %}active{% endif %}">
    <i class="bi bi-truck"></i> Carriers
  </a>
  <a href="/rates" class="tab-link {% if active_tab == 'rates' %}active{% endif %}">
    <i class="bi bi-currency-dollar"></i> Rates
  </a>
</div>
{% endif %}

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmYvBaVlnLM4GzaFEQRNKb4inCF7"
        crossorigin="anonymous"></script>
{% block scripts %}{% endblock %}
{% if session.get('logged_in') %}
<script src="{{ url_for('static', filename='quotes.js') }}?v={{ sv|default('1') }}"></script>
<script src="{{ url_for('static', filename='learn.js') }}?v={{ sv|default('1') }}"></script>
<!-- Auto-reload: detects server restart and refreshes page automatically -->
<script>
(function(){
  const V = '{{ sv|default("1") }}';
  setInterval(function(){
    fetch('/api/version').then(r=>r.json()).then(d=>{
      if(d.v && d.v !== V) window.location.reload();
    }).catch(function(){});
  }, 3000);
})();
</script>
{% endif %}
</body>
</html>
