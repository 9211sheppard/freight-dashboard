<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0a0c0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/static/driver_manifest.json">
  <title>{% block title %}TMS Master — Driver{% endblock %}</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --gold: #c8a96e;
      --gold-dim: rgba(200,169,110,0.18);
      --gold-hover: #d4b87a;
      --surface: #111214;
      --surface-raised: #1a1c1f;
      --surface-card: #1e2023;
      --border: rgba(255,255,255,0.07);
      --text: #e2e8f0;
      --text-dim: #8a9bb0;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: var(--surface);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* Safe area padding for notches */
    .driver-root {
      min-height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 72px); /* space for bottom nav */
      max-width: 480px;
      margin: 0 auto;
    }

    /* Top bar */
    .driver-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,12,15,0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      padding-top: calc(12px + var(--safe-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .driver-topbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .driver-topbar-logo {
      width: 34px; height: 34px;
      background: var(--gold-dim);
      border: 1.5px solid rgba(200,169,110,0.3);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: var(--gold); font-size: 1rem;
    }
    .driver-topbar-name {
      font-size: .9rem; font-weight: 700; color: #fff;
      letter-spacing: -.01em;
    }
    .driver-topbar-sub {
      font-size: .72rem; color: var(--gold); font-weight: 600;
    }
    .driver-topbar-right {
      display: flex; align-items: center; gap: 8px;
    }
    .driver-topbar-badge {
      background: var(--gold-dim); color: var(--gold);
      border: 1px solid rgba(200,169,110,0.25);
      border-radius: 20px; padding: 3px 10px;
      font-size: .7rem; font-weight: 700; letter-spacing: .04em;
    }

    /* Bottom navigation */
    .driver-bottom-nav {
      position: fixed;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: rgba(15,17,20,0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      padding-bottom: var(--safe-bottom);
      z-index: 100;
      display: flex;
    }
    .driver-nav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 10px 4px 8px;
      color: var(--text-dim);
      text-decoration: none;
      font-size: .68rem; font-weight: 600;
      gap: 4px;
      transition: color .15s;
    }
    .driver-nav-item i { font-size: 1.35rem; }
    .driver-nav-item.active { color: var(--gold); }
    .driver-nav-item:active { opacity: .7; }

    /* Cards */
    .d-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .d-card-gold {
      border-color: rgba(200,169,110,0.22);
    }
    .d-card-header {
      padding: 14px 16px 0;
      font-size: .67rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: #555;
    }
    .d-card-body { padding: 14px 16px 16px; }

    /* Action buttons — large tap targets */
    .d-action {
      display: flex; align-items: center; gap: 14px;
      padding: 16px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      transition: background .12s, border-color .12s;
      cursor: pointer; width: 100%;
      -webkit-appearance: none; appearance: none;
      font-family: inherit; font-size: inherit;
    }
    .d-action:active, .d-action:hover { background: #23262a; border-color: rgba(255,255,255,0.13); color: #fff; }
    .d-action-icon {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0;
    }
    .d-action-icon.gold   { background: rgba(200,169,110,0.14); color: var(--gold); }
    .d-action-icon.blue   { background: rgba(99,179,237,0.12); color: #63b3ed; }
    .d-action-icon.green  { background: rgba(74,222,128,0.10); color: #4ade80; }
    .d-action-icon.purple { background: rgba(167,139,250,0.10); color: #a78bfa; }
    .d-action-icon.red    { background: rgba(248,113,113,0.10); color: #f87171; }
    .d-action-label { font-size: .95rem; font-weight: 600; }
    .d-action-sub   { font-size: .72rem; color: var(--text-dim); margin-top: 2px; }

    /* Status pill */
    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px;
      font-size: .75rem; font-weight: 700; letter-spacing: .03em;
    }
    .status-pill.delivered { background: rgba(74,222,128,0.12); color: #4ade80; border: 1px solid rgba(74,222,128,.2); }
    .status-pill.in-transit { background: rgba(99,179,237,0.12); color: #63b3ed; border: 1px solid rgba(99,179,237,.2); }
    .status-pill.pending  { background: rgba(200,169,110,0.12); color: var(--gold); border: 1px solid rgba(200,169,110,.2); }
    .status-pill.issue    { background: rgba(248,113,113,0.12); color: #f87171; border: 1px solid rgba(248,113,113,.2); }

    /* Primary button */
    .btn-driver-primary {
      display: block; width: 100%;
      padding: 15px; border-radius: 12px;
      background: var(--gold); color: #000;
      font-weight: 700; font-size: .95rem;
      border: none; cursor: pointer;
      transition: background .12s;
    }
    .btn-driver-primary:hover, .btn-driver-primary:active { background: var(--gold-hover); }
    .btn-driver-primary:disabled { background: #3a3a2a; color: #666; cursor: not-allowed; }

    .btn-driver-outline {
      display: block; width: 100%;
      padding: 13px; border-radius: 12px;
      background: transparent; color: var(--gold);
      font-weight: 600; font-size: .9rem;
      border: 1.5px solid rgba(200,169,110,0.35); cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .btn-driver-outline:active { background: var(--gold-dim); }

    /* Form inputs */
    .d-input {
      width: 100%; background: #111315;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; color: var(--text);
      padding: 12px 14px; font-size: .9rem;
      font-family: inherit; outline: none;
      -webkit-appearance: none; appearance: none;
    }
    .d-input:focus { border-color: rgba(200,169,110,.5); }
    .d-label {
      font-size: .7rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: #666; display: block; margin-bottom: 6px;
    }

    /* Separator */
    .d-sep { height: 1px; background: var(--border); margin: 0 16px; }

    /* Stat row */
    .d-stat-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; padding: 14px 16px;
    }
    .d-stat { }
    .d-stat-label { font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #555; margin-bottom: 2px; }
    .d-stat-value { font-size: .9rem; font-weight: 600; color: var(--text); }

    /* Alert */
    .d-alert {
      padding: 12px 14px; border-radius: 10px;
      font-size: .82rem; font-weight: 500;
    }
    .d-alert-success { background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,.2); color: #4ade80; }
    .d-alert-error   { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,.2); color: #f87171; }

    /* Page sections */
    .d-section { padding: 16px 16px 0; }
    .d-section-label {
      font-size: .67rem; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      color: #444; margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* Spinner */
    .d-spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(200,169,110,.3);
      border-top-color: var(--gold);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* PWA install bar */
    .d-install-bar {
      background: var(--gold-dim); border: 1px solid rgba(200,169,110,.2);
      border-radius: 12px; padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
      font-size: .78rem; color: #b0905a;
    }
    .d-install-bar i { font-size: 1.2rem; color: var(--gold); flex-shrink: 0; }

    /* Scrollable content area */
    .d-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body>

{% block body %}
<div class="driver-root">
  {% block content %}{% endblock %}
</div>

<!-- Bottom Nav -->
<nav class="driver-bottom-nav">
  <a href="{{ driver_home_url | default('/tms/driver-app') }}" class="driver-nav-item {% block nav_home %}{% endblock %}">
    <i class="bi bi-house-fill"></i>Home
  </a>
  <a href="{{ driver_loads_url | default('/tms/driver-app?tab=loads') }}" class="driver-nav-item {% block nav_loads %}{% endblock %}">
    <i class="bi bi-box-seam-fill"></i>Loads
  </a>
  <a href="{{ driver_status_url | default('/tms/driver-app?tab=status') }}" class="driver-nav-item {% block nav_status %}{% endblock %}">
    <i class="bi bi-arrow-up-circle-fill"></i>Status
  </a>
  <a href="{{ driver_messages_url | default('/tms/driver-app?tab=messages') }}" class="driver-nav-item {% block nav_messages %}{% endblock %}">
    <i class="bi bi-chat-dots-fill"></i>Messages
  </a>
  <a href="{{ driver_profile_url | default('/tms/driver-app?tab=profile') }}" class="driver-nav-item {% block nav_profile %}{% endblock %}">
    <i class="bi bi-person-fill"></i>Profile
  </a>
</nav>
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmXFMCHR+bw8k/o4M0+f3CGoMLB" crossorigin="anonymous"></script>

{% block extra_scripts %}{% endblock %}
</body>
</html>
