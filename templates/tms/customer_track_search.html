<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Shipment</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <link rel="stylesheet" href="/static/bootstrap-icons.min.css">
  <style nonce="{{ csp_nonce }}">
    :root {
      --bg:      #0a0a0f;
      --surface: #111118;
      --border:  #1e1e2e;
      --text:    #e8e8f0;
      --muted:   #6c6c84;
      --accent:  #4f8ef7;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .track-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
    }
    .track-logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Center content */
    .search-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .search-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 460px;
      text-align: center;
    }
    .search-icon {
      font-size: 2.8rem;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .search-card h2 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .search-card p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }
    .search-input-group {
      display: flex;
      gap: 0.5rem;
    }
    .search-input {
      flex: 1;
      background: #0a0a0f;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 1rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color .15s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--accent); }
    .search-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 0.65rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity .15s;
    }
    .search-btn:hover { opacity: 0.88; }
    .search-hint {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* Footer */
    .track-footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 1rem 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header class="track-header">
    <a href="/tms/track" class="track-logo">
      <i class="bi bi-hexagon-fill"></i>
      FlashCargo
    </a>
  </header>

  <div class="search-wrap">
    <div class="search-card">
      <div class="search-icon"><i class="bi bi-box-seam"></i></div>
      <h2>Track Your Shipment</h2>
      <p>Enter your shipment reference number to see real-time status and updates.</p>

      <form method="GET" action="/tms/track">
        <div class="search-input-group">
          <input
            type="text"
            name="ref"
            class="search-input"
            placeholder="e.g. SHP-2024-001"
            autocomplete="off"
            spellcheck="false"
            autofocus
          >
          <button type="submit" class="search-btn">
            <i class="bi bi-search"></i> Track
          </button>
        </div>
      </form>

      <p class="search-hint">Your reference number was provided in your booking confirmation email.</p>
    </div>
  </div>

  <footer class="track-footer">
    Powered by <strong>FlashCargo TMS</strong>
  </footer>

</body>
</html>
