<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ brand_name }} Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 32%),
        radial-gradient(circle at bottom right, rgba(249, 115, 22, 0.14), transparent 28%),
        linear-gradient(180deg, #0f172a 0%, #111827 100%);
      color: #e5e7eb;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .login-card {
      width: min(100%, 420px);
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.88);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
    }
    .login-kicker {
      color: #38bdf8;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .form-control,
    .form-control:focus {
      background: #0b1220;
      color: #f8fafc;
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="login-kicker mb-2">TMS Master</div>
    <h1 class="h3 mb-2">Sign in</h1>
    <p class="text-secondary mb-4">Use the standalone app credentials to access the TMS workspace.</p>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="next" value="{{ next_url }}">
      {% if csrf_token is defined %}
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% endif %}
      <div class="mb-3">
        <label class="form-label" for="login-username">Email</label>
        <input id="login-username" class="form-control" type="text" name="username" value="{{ entered_username|default('') }}" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label" for="login-password">Password</label>
        <input id="login-password" class="form-control" type="password" name="password" required>
      </div>
      <button class="btn btn-info w-100" type="submit">Open TMS Master</button>
    </form>
  </main>
</body>
</html>
