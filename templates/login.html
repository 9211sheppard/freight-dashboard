{% extends "base.html" %}

{% block title %}Login — Freight Intelligence Dashboard{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-card card shadow-sm p-4">
    <div class="text-center mb-4">
      <div class="login-icon mb-3">
        <i class="bi bi-people-fill"></i>
      </div>
      <h4 class="fw-bold mb-0">Freight Intelligence</h4>
      <p class="text-muted small mt-1">Sign in to your account</p>
    </div>

    {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
      <i class="bi bi-exclamation-circle-fill"></i>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label for="email" class="form-label fw-medium">Email</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent">
            <i class="bi bi-envelope-fill text-muted"></i>
          </span>
          <input type="email" class="form-control" id="email" name="email"
                 placeholder="you@company.com" autofocus autocomplete="email">
        </div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label fw-medium">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent">
            <i class="bi bi-lock-fill text-muted"></i>
          </span>
          <input type="password" class="form-control" id="password" name="password"
                 placeholder="Your password" autocomplete="current-password">
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="{{ url_for('forgot_password') }}" class="text-muted small">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold">
        <i class="bi bi-arrow-right-circle me-1"></i> Sign In
      </button>
    </form>

    <hr class="my-3">
    <p class="text-center text-muted small mb-0">
      No account yet?
      <a href="{{ url_for('register') }}" class="text-primary">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
